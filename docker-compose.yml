services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity
      POSTGRES_DB: capacity
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capacity']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      HOST: 0.0.0.0
      PORT: 4521
      DATABASE_URL: postgres://capacity:capacity@db:5432/capacity?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:4521:4521'

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:4521
    depends_on:
      - api
    ports:
      - '127.0.0.1:4522:4522'
    volumes:
      - ./web:/app
      - /app/node_modules
